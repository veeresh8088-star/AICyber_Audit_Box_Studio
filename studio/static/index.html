<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuditBox Release Studio</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --line:#252a36; --text:#e6e9ef;
    --muted:#96a0b5; --accent:#6c8cff; --ok:#2fbf71; --bad:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700}
  .repo{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace}
  main{max-width:1100px;margin:0 auto;padding:22px 24px 60px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:26px 0 10px;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:#39405480}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card.bad{border-color:var(--bad)}
  .cust{font-weight:700;font-size:15px;margin-bottom:2px}
  .fw{display:inline-block;background:#232838;border:1px solid var(--line);
      border-radius:999px;padding:1px 9px;font-size:11px;margin:4px 4px 0 0}
  .kv{color:var(--muted);font-size:12px;margin-top:8px;
      font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap}
  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  input{background:#10131b;border:1px solid var(--line);color:var(--text);
        border-radius:8px;padding:8px 10px;font-size:14px;min-width:160px;
        font-family:ui-monospace,Consolas,monospace}
  input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#0b0d12;border:0;border-radius:8px;
         padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
  button.ghost{background:#222736;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .steps{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .step{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);
        align-items:flex-start}
  .step:last-child{border-bottom:0}
  .mark{width:64px;flex:none;font-weight:700;font-size:11px;letter-spacing:.06em;
        text-transform:uppercase;padding-top:2px}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.skip{color:var(--warn)}
  .mark.run{color:var(--accent)}
  .sname{width:130px;flex:none;font-weight:600}
  .sdetail{color:var(--muted);font-family:ui-monospace,Consolas,monospace;
           font-size:12px;word-break:break-word;flex:1}
  .secs{color:var(--muted);font-size:11px;flex:none}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px}
  .note.bad{border-left-color:var(--bad)}
  .note.ok{border-left-color:var(--ok)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
  .hide{display:none}
  .muted{color:var(--muted)}
  .err{color:var(--bad);font-weight:600}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .shape{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .shape button{background:#1b1f2b;color:var(--muted);border:0;border-right:1px solid var(--line);
                border-radius:0;padding:9px 18px;font-weight:600}
  .shape button:last-child{border-right:0}
  .shape button.on{background:var(--accent);color:#0b0d12;font-weight:700}
  .hw{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;margin-top:10px}
  .hw input{min-width:110px}
  .out{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--text);
       background:#10131b;border:1px solid var(--line);border-radius:8px;
       padding:10px 12px;margin-top:10px;white-space:pre-wrap}
  ul.files{margin:6px 0 0;padding-left:18px;font-family:ui-monospace,Consolas,monospace;
           font-size:12px;color:var(--muted)}
  .card.add{border-style:dashed;display:flex;align-items:center;justify-content:center;
            color:var(--muted);font-weight:700;min-height:96px}
  .chk{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:13px;
       color:var(--text);cursor:pointer}
  .chk input{min-width:0;width:16px;height:16px;accent-color:var(--accent)}
  .sub{font-size:11px;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;
       letter-spacing:.07em;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>AuditBox Release Studio</h1>
  <span class="repo" id="repo"></span>
</header>

<main>
  <div id="stale" class="note bad hide"></div>
  <h2>Customer</h2>
  <div class="cards" id="profiles"><span class="muted">loading…</span></div>

  <div class="hw hide" id="newcust">
    <div class="sub">New customer</div>
    <div class="row">
      <div><label for="nc-name">Customer</label><input id="nc-name" placeholder="Acme Bank"></div>
      <div><label for="nc-exp">Licence expires</label><input id="nc-exp" type="date"></div>
      <div><label for="nc-seats">Seats</label><input id="nc-seats" type="number" value="5" min="1" style="min-width:90px"></div>
      <div><label for="nc-cores">Cores</label><input id="nc-cores" type="number" value="8" min="1" style="min-width:90px"></div>
      <div><label for="nc-ram">RAM (GB)</label><input id="nc-ram" type="number" value="32" min="1" style="min-width:90px"></div>
    </div>
    <div class="sub">Frameworks</div>
    <div id="nc-fw"></div>
    <div class="row" style="margin-top:12px">
      <button onclick="createCustomer()">Create</button>
      <button class="ghost" onclick="document.getElementById('newcust').classList.add('hide')">Cancel</button>
      <span class="muted" id="nc-out"></span>
    </div>
  </div>

  <div id="rest" class="hide">
    <h2>Licence &mdash; what this customer may audit</h2>
    <div class="hw" id="lic">
      <div class="row">
        <div><label for="lic-name">Customer</label><input id="lic-name"></div>
        <div><label for="lic-exp">Licence expires</label><input id="lic-exp" type="date"></div>
        <div><label for="lic-seats">Seats</label><input id="lic-seats" type="number" min="1" style="min-width:90px"></div>
      </div>
      <div class="sub">Frameworks sold to this site</div>
      <div id="lic-fw"></div>
      <div class="sub">Build gates</div>
      <div id="lic-gates"></div>
      <div class="row" style="margin-top:12px">
        <button class="ghost" onclick="saveLicence()">Save licence &amp; gates</button>
        <span class="muted" id="lic-out"></span>
      </div>
    </div>

    <h2>Machine this customer runs on</h2>
    <div class="hw">
      <div class="row">
        <div><label for="hw-cores">Physical cores</label>
             <input id="hw-cores" type="number" min="1" oninput="resize()"></div>
        <div><label for="hw-ram">RAM (GB)</label>
             <input id="hw-ram" type="number" min="1" step="0.5" oninput="resize()"></div>
        <div><label for="hw-ctx">Context per request</label>
             <input id="hw-ctx" type="number" step="1024" oninput="resize()"></div>
        <button class="ghost" onclick="saveHw()">Save to profile</button>
      </div>
      <div class="out" id="hw-out">—</div>
    </div>

    <h2>Version</h2>
    <div class="row" style="margin-bottom:10px">
      <div>
        <label>Bundle</label>
        <div class="shape" id="shape">
          <button class="on" data-s="auto" onclick="setShape('auto')">Decide for me</button>
          <button data-s="patch" onclick="setShape('patch')">App code only</button>
          <button data-s="full" onclick="setShape('full')">Everything</button>
        </div>
        <div class="muted" id="shape-what" style="font-size:12px;margin-top:6px"></div>
      </div>
    </div>
    <form id="form" onsubmit="return false">
      <div>
        <label for="version">New version to build</label>
        <input id="version" placeholder="v3.25" autocomplete="off">
      </div>
      <div>
        <label for="previous">Version the customer is on</label>
        <input id="previous" placeholder="v3.24" autocomplete="off" list="known">
        <datalist id="known"></datalist>
      </div>
      <button class="ghost" id="btn-plan" onclick="doPlan()">Check first</button>
      <button id="btn-build" onclick="doBuild()">Build</button>
    </form>
    <div class="muted" id="versions" style="font-size:12px;margin-top:6px"></div>
    <div id="plan"></div>

    <div id="progress" class="hide">
      <h2>Build</h2>
      <div class="steps" id="steps"></div>
      <div id="result"></div>
    </div>
  </div>
</main>

<script>
let PROFILES = [], SELECTED = null, POLL = null, SHAPE = "auto", VERSIONS = [];
const PAGE_API = 5;   // must match web.API_VERSION; see the banner below

const SHAPE_MEANS = {
  auto:  "Compares the two versions and picks. Only src/ and config/ changed " +
         "-> app code only. Anything under that -- dependencies, a Dockerfile, " +
         "a model -- and it builds everything, because a patch cannot rebuild " +
         "those layers on the customer's machine.",
  patch: "Rebuilds only the application layer on top of the images the customer " +
         "already has. About 2 GB. Their database, evidence and past audits are " +
         "untouched. It will be refused if anything beneath the app layer changed.",
  full:  "Every image, including the model weights. About 8 GB. Needed for a " +
         "first install, or after a dependency, Dockerfile or model change.",
};

function setShape(s){
  SHAPE = s;
  document.querySelectorAll("#shape button").forEach(b =>
    b.classList.toggle("on", b.dataset.s === s));
  document.getElementById("shape-what").textContent = SHAPE_MEANS[s] || "";
  document.getElementById("plan").innerHTML = "";
}

async function resize(){
  const c = +document.getElementById("hw-cores").value,
        r = +document.getElementById("hw-ram").value,
        x = +document.getElementById("hw-ctx").value;
  const out = document.getElementById("hw-out");
  if (!c || !r || !x){ out.textContent = "—"; return; }
  const res = await fetch("/api/size", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({cores:c, ram_gb:r, ctx:x})});
  const d = await res.json();
  if (d.error){ out.className = "err"; out.textContent = d.error; return; }
  out.className = "muted";
  const s = d.sizing;
  out.textContent =
    "-np " + s.np_slots + "   -c " + s.shared_pool.toLocaleString() +
    "   (" + s.ctx_per_request.toLocaleString() + " per request\n" +
    s.max_concurrent_audits + " concurrent audits\n" +
    "model " + s.model_gb + "GB + KV " + (s.np_slots * s.kv_gb_per_slot).toFixed(1) +
    "GB = " + s.projected_llm_gb + "GB of " + s.total_ram_gb +
    "GB  (headroom " + s.headroom_gb + "GB, limited by " + s.limited_by + ")";
}

async function saveHw(){
  if (!SELECTED) return;
  const body = { profile: SELECTED.file,
    physical_cores: +document.getElementById("hw-cores").value,
    ram_gb: +document.getElementById("hw-ram").value,
    ctx_per_request: +document.getElementById("hw-ctx").value };
  const r = await fetch("/api/hardware", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  const out = document.getElementById("hw-out");
  if (d.error){ out.className = "err"; out.textContent = "not saved: " + d.error; return; }
  out.className = "out";
  if (d.summary && d.summary.valid){
    const i = PROFILES.findIndex(p => p.file === SELECTED.file);
    if (i >= 0){ PROFILES[i] = d.summary; SELECTED = d.summary; }
  }
  out.textContent = "saved to " + SELECTED.file + " — " + Object.keys(d.changed).join(", ");
  setTimeout(resize, 600);
}

function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function load(){
  const r = await fetch("/api/profiles");
  const d = await r.json();
  PROFILES = d.profiles || [];
  document.getElementById("repo").textContent = d.repo || "";
  VERSIONS = d.versions || [];
  FRAMEWORKS = d.frameworks || [];
  const stale = document.getElementById("stale");
  if ((d.api_version || 0) < PAGE_API){
    stale.classList.remove("hide");
    stale.innerHTML = "<b>This page is newer than the server running it.</b><br>" +
      "The page is read from disk each time; the endpoints are not. Buttons here " +
      "will answer <span class='mono'>not found</span> until you stop the server " +
      "and start it again.";
  } else { stale.classList.add("hide"); }
  if (d.is_git_repo === false){
    stale.classList.remove("hide");
    stale.innerHTML = "<b>That folder is not a git repository.</b><br>" +
      "Versions come from its tags, so patch and full cannot be decided. " +
      "Start the server with <span class='mono'>--repo</span> pointing at the " +
      "product repository.";
  }
  const dl = document.getElementById("known");
  if (dl) dl.innerHTML = VERSIONS.map(v => `<option value="${esc(v)}">`).join("");
  const vs = document.getElementById("versions");
  if (vs) vs.textContent = VERSIONS.length
    ? "Versions in the repository: " + VERSIONS.join(", ")
    : "No version tags in the repository yet — tag a release and the patch option becomes available.";
  boxes("nc-fw", FRAMEWORKS.map(f => [f.id, fwLabel(f)]), [], "ncfw-");
  renderCards();
}

function renderCards(){
  const box = document.getElementById("profiles");
  box.innerHTML = PROFILES.map((p,i) => p.valid ? `
    <div class="card" data-i="${i}" onclick="pick(${i})">
      <div class="cust">${esc(p.customer)}</div>
      <div>${p.frameworks.map(f=>`<span class="fw">${esc(f)}</span>`).join("")}</div>
      <div class="kv">expires ${esc(p.expires)}
${p.cores} cores · ${p.ram_gb} GB · ${esc(p.model)}
-np ${p.sizing.np_slots}  -c ${p.sizing.shared_pool.toLocaleString()}
${p.sizing.max_concurrent_audits} concurrent audits (limited by ${esc(p.sizing.limited_by)})</div>
    </div>` : `
    <div class="card bad">
      <div class="cust">${esc(p.file)}</div>
      <div class="kv">will not load: ${esc(p.error)}</div>
    </div>`).join("") +
    `<div class="card add" onclick="document.getElementById('newcust').classList.remove('hide')">
       + Add customer</div>`;
}

function pick(i){
  SELECTED = PROFILES[i];
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("sel", c.dataset.i == String(i)));
  document.getElementById("rest").classList.remove("hide");
  document.getElementById("plan").innerHTML = "";
  document.getElementById("hw-cores").value = SELECTED.cores;
  document.getElementById("hw-ram").value = SELECTED.ram_gb;
  document.getElementById("hw-ctx").value = SELECTED.sizing.ctx_per_request;
  fillLicence();
  resize();
}

// Filled from /api/profiles. Hardcoding this list is what put PCIDSS and
// HIPAA on the page -- neither of which the product has ever audited.
let FRAMEWORKS = [];
const GATES = [
  ["compile_source",  "Compile to binaries (no readable source ships)"],
  ["encrypt_bundle",  "Encrypt the bundle"],
  ["run_tests",       "Run the product's tests"],
  ["run_sca",         "Scan dependencies"],
  ["verify_models",   "Check the model weights are in the image"],
  ["write_checksum",  "Write a sha256 beside the artifact"],
];

function fwLabel(f){
  return f.name + (f.controls ? "  (" + f.controls + " controls)" : "");
}

function boxes(host, items, checked, prefix){
  document.getElementById(host).innerHTML = items.map(([v, label]) =>
    `<label class="chk"><input type="checkbox" id="${prefix}${v}"
       ${checked.indexOf(v) >= 0 ? "checked" : ""}> ${esc(label)}</label>`).join("");
}

function fillLicence(){
  document.getElementById("lic-name").value = SELECTED.customer;
  document.getElementById("lic-exp").value = SELECTED.expires;
  document.getElementById("lic-seats").value = SELECTED.seats || 1;
  boxes("lic-fw", FRAMEWORKS.map(f => [f.id, fwLabel(f)]), SELECTED.frameworks, "fw-");
  const g = SELECTED.gates || {};
  const on = [];
  if (g.compile) on.push("compile_source");
  if (g.encrypt) on.push("encrypt_bundle");
  if (g.tests) on.push("run_tests");
  if (g.sca) on.push("run_sca");
  if (g.verify_models) on.push("verify_models");
  if (g.write_checksum !== false) on.push("write_checksum");
  boxes("lic-gates", GATES, on, "g-");
  document.getElementById("lic-out").textContent = "";
}

function picked(prefix, items){
  return items.map(i => (i && i.id) ? i.id : (Array.isArray(i) ? i[0] : i))
              .filter(v => (document.getElementById(prefix + v) || {}).checked);
}

async function saveLicence(){
  if (!SELECTED) return;
  const body = { profile: SELECTED.file,
    customer: document.getElementById("lic-name").value.trim(),
    expires: document.getElementById("lic-exp").value,
    seats: +document.getElementById("lic-seats").value,
    frameworks: picked("fw-", FRAMEWORKS) };
  GATES.forEach(([k]) => body[k] = (document.getElementById("g-" + k) || {}).checked);
  const r = await fetch("/api/licence", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  const out = document.getElementById("lic-out");
  if (d.error){ out.className = "err"; out.textContent = d.error; return; }
  out.className = "muted";
  if (d.summary && d.summary.valid){
    const i = PROFILES.findIndex(x => x.file === SELECTED.file);
    if (i >= 0){ PROFILES[i] = d.summary; SELECTED = d.summary; }
    renderCards();
    document.querySelectorAll(".card").forEach(c =>
      c.classList.toggle("sel", c.dataset.i == String(i)));
  }
  out.textContent = "saved: " + Object.keys(d.changed || {}).join(", ");
}

async function createCustomer(){
  const body = {
    customer: document.getElementById("nc-name").value.trim(),
    expires: document.getElementById("nc-exp").value,
    seats: +document.getElementById("nc-seats").value,
    physical_cores: +document.getElementById("nc-cores").value,
    ram_gb: +document.getElementById("nc-ram").value,
    frameworks: picked("ncfw-", FRAMEWORKS) };
  const r = await fetch("/api/customer", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  const out = document.getElementById("nc-out");
  if (d.error){ out.className = "err"; out.textContent = d.error; return; }
  out.className = "muted";
  out.textContent = "created " + d.created;
  await setShape("auto");
load();
  document.getElementById("newcust").classList.add("hide");
}

function payload(){
  return { profile: SELECTED.file,
           version: document.getElementById("version").value.trim(),
           previous: document.getElementById("previous").value.trim(),
           shape: SHAPE };
}

async function doPlan(){
  if (!SELECTED) return;
  const el = document.getElementById("plan");
  el.innerHTML = '<div class="note muted">checking…</div>';
  const r = await fetch("/api/plan", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload())});
  const d = await r.json();
  if (d.error){ el.innerHTML = `<div class="note bad">${esc(d.error)}</div>`; return; }
  if (d.refused){
    el.innerHTML = `<div class="note bad"><b>A patch cannot be used here.</b><br>
      ${esc(d.reason)}<br><span class="muted">Blocking: ${esc((d.blocking||[]).join(", "))}</span><br>
      A full bundle will be built instead.</div>`;
    return;
  }
  const g = d.summary ? d.summary.gates : {};
  el.innerHTML = `<div class="note ok"><b>Shape: ${esc(d.shape)}</b>
    ${d.reason ? "— " + esc(d.reason) : ""}<br>
    <span class="muted">Gates: tests ${g.tests?"on":"OFF"} · scan ${g.sca?esc(g.sca_severity):"OFF"}
    · compile ${g.compile?"on":"OFF"} · encrypt ${g.encrypt?"on":"OFF"}
    · model check ${g.verify_models?"on":"OFF"}</span><br>
    <span class="muted">Nothing was built. This was a dry run.</span>
    ${(d.contents||[]).length ? `<div style="margin-top:8px"><b>The bundle will contain:</b>
      <ul class="files">${d.contents.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <span class="muted">Each of these is checked before publishing; a missing one stops the build.</span>
    </div>` : ""}</div>`;
}

async function doBuild(){
  if (!SELECTED) return;
  document.getElementById("btn-build").disabled = true;
  document.getElementById("btn-plan").disabled = true;
  document.getElementById("progress").classList.remove("hide");
  document.getElementById("steps").innerHTML =
    '<div class="step"><span class="mark run">start</span><span class="sname">…</span>' +
    '<span class="sdetail">starting</span></div>';
  document.getElementById("result").innerHTML = "";
  const r = await fetch("/api/build", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload())});
  const d = await r.json();
  if (d.error){ finish({error:d.error, steps:[]}); return; }
  POLL = setInterval(() => poll(d.job), 1000);
  poll(d.job);
}

async function poll(id){
  const r = await fetch("/api/build/" + id);
  const d = await r.json();
  render(d.steps || []);
  if (d.done){ clearInterval(POLL); finish(d); }
}

function render(steps){
  const box = document.getElementById("steps");
  box.innerHTML = steps.map(s => {
    const cls = s.skipped ? "skip" : (s.ok ? "ok" : "bad");
    const word = s.skipped ? "skipped" : (s.ok ? "ok" : "failed");
    return `<div class="step"><span class="mark ${cls}">${word}</span>
      <span class="sname">${esc(s.name)}</span>
      <span class="sdetail">${esc(s.detail)}</span>
      <span class="secs">${s.seconds ? s.seconds + "s" : ""}</span></div>`;
  }).join("") || '<div class="step"><span class="sdetail muted">waiting…</span></div>';
}

function finish(d){
  document.getElementById("btn-build").disabled = false;
  document.getElementById("btn-plan").disabled = false;
  const el = document.getElementById("result");
  if (d.error){
    el.innerHTML = `<div class="note bad"><b>The build stopped.</b>
      <div class="mono">${esc(d.error)}</div></div>`;
    return;
  }
  if (d.ok === false){
    const failed = (d.steps || []).filter(s => !s.ok).pop();
    el.innerHTML = `<div class="note bad"><b>Stopped at: ${esc(failed ? failed.name : "?")}</b><br>
      ${esc(failed ? failed.detail : "")}<br>
      <span class="muted">No artifact was produced, and nothing was published.</span></div>`;
    return;
  }
  el.innerHTML = `<div class="note ok"><b>Built${d.shape ? " (" + esc(d.shape) + ")" : ""}.</b>
    <div class="mono">artifact: ${esc(d.artifact || "-")}</div>
    ${d.sha256 ? `<div class="mono">sha256: ${esc(d.sha256)}</div>` : ""}
    ${d.licence_key ? `<div class="mono">licence: ${esc(d.licence_key)}</div>` : ""}
  </div>`;
}

setShape("auto");
load();
</script>
</body>
</html>
